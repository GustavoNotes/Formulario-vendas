<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bala de Coco Recheada - Pedidos</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#ff6a00,#ee0979);
  padding: 15px;
  -webkit-text-size-adjust: 100%;
}

.container {
  width: 100%;
  max-width: 520px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: none;
}

.card.active {
  display: block;
}

h2 {
  margin-top: 0;
  color: #ee0979;
}

p {
  color: #555;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

/* BOTÃO PRÓXIMO COM FLUTUAÇÃO */
.next {
  background: #ee0979;
  color: white;
  animation: floatBtn 2.8s ease-in-out infinite;
}

/* animação leve */
@keyframes floatBtn {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-4px); }
  100% { transform: translateY(0px); }
}

.submit {
  background: #00c853;
  color: white;
}

.back {
  background: #ccc;
  margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="container">

<form action="https://formsubmit.co/luisgustavo.olliver@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="🍬 Novo pedido - Bala de Coco Recheada">

<!-- STEP 1 -->
<div class="card active">
  <h2>🍬 Bala de Coco Recheada</h2>
  <p>Faça seu pedido abaixo e entraremos em contato.</p>

  <input type="text" name="nome" placeholder="Seu nome completo" required>

  <button type="button" class="next" onclick="next()">Fazer pedido</button>
</div>

<!-- STEP 2 -->
<div class="card">
  <h2>📱 WhatsApp</h2>
  <p>Vamos confirmar seu pedido por aqui.</p>

  <input type="text" name="whatsapp" placeholder="Seu WhatsApp" required>

  <button type="button" class="back" onclick="prev()">Voltar</button>
  <button type="button" class="next" onclick="next()">Continuar</button>
</div>

<!-- STEP 3 -->
<div class="card">
  <h2>📦 Pedido</h2>
  <p>Informe quantidade ou tipo do pedido.</p>

  <input type="text" name="pedido" placeholder="Ex: 20 unidades recheadas" required>

  <button type="button" class="back" onclick="prev()">Voltar</button>
  <button type="submit" class="submit">Finalizar pedido</button>
</div>

</form>

</div>

<script>
let current = 0;
const cards = document.querySelectorAll(".card");

function show(i){
  cards.forEach(c => c.classList.remove("active"));
  cards[i].classList.add("active");
  current = i;
}

function next(){
  if(current < cards.length - 1) show(current + 1);
}

function prev(){
  if(current > 0) show(current - 1);
}

show(0);
</script>

</body>
</html>
